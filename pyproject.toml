[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-ews-mcp"
version = "0.7.2"
description = "Local stdio MCP mail and calendar assistant for on-premises Microsoft Exchange via EWS + NTLM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Exchange EWS MCP contributors"}]
dependencies = [
  "mcp[cli]>=1.27,<2",
  "requests>=2.32,<3",
  "requests-ntlm>=1.3,<2",
  "keyring>=25,<26",
  "platformdirs>=4.3,<5",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
exchange-ews-mcp = "exchange_ews_mcp.cli:main"
exchange-ews-mcp-server = "exchange_ews_mcp.server:main"
exchange-ews-mcp-debug-server = "exchange_ews_mcp.server:debug_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
