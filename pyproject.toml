[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-ews-mcp"
dynamic = ["version"]
description = "Local stdio MCP mail, calendar, and weekly-report assistant for on-premises Microsoft Exchange via EWS + NTLM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Exchange EWS MCP contributors"}]
keywords = ["exchange", "ews", "mcp", "model-context-protocol", "ntlm", "outlook", "weekly-report"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp[cli]>=1.27,<2",
  "requests>=2.32,<3",
  "requests-ntlm>=1.3,<2",
  "keyring>=25,<26",
  "platformdirs>=4.3,<5",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/ShermanGu/exchange-ews-mcp"
Repository = "https://github.com/ShermanGu/exchange-ews-mcp"
Issues = "https://github.com/ShermanGu/exchange-ews-mcp/issues"
Changelog = "https://github.com/ShermanGu/exchange-ews-mcp/blob/main/docs/CHANGELOG.md"

[project.scripts]
exchange-ews-mcp = "exchange_ews_mcp.cli:main"
exchange-ews-mcp-server = "exchange_ews_mcp.server:main"
exchange-ews-mcp-debug-server = "exchange_ews_mcp.server:debug_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "exchange_ews_mcp.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
