name: Bug report / 错误报告
description: Report a reproducible problem without including mailbox data or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, real mailbox content, internal hostnames, or Exchange identifiers.
        感谢反馈。请勿提交凭据、真实邮件内容、内部主机名或 Exchange 标识。

  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题概述
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Output of `exchange-ews-mcp version` or the commit SHA.
    validations:
      required: true

  - type: dropdown
    id: exchange
    attributes:
      label: Exchange environment / Exchange 环境
      options:
        - Exchange 2010
        - Exchange 2013
        - Exchange 2016
        - Exchange 2019
        - Other on-premises Exchange
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
      description: Use synthetic or redacted values only.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / 脱敏日志
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist / 安全确认
      options:
        - label: I removed credentials, tokens, mailbox content, internal hostnames, and personal data.
          required: true
        - label: This is not a security vulnerability; security reports must use a private advisory.
          required: true
